<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin — Garoua Vibes</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800;900&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0d0f14;
      --surface: #161920;
      --surface2:#1e222d;
      --surface3:#252a36;
      --border:  rgba(255,255,255,.08);
      --border2: rgba(255,255,255,.12);
      --text:    #f0f2f7;
      --muted:   rgba(240,242,247,.4);
      --orange:  #f97316;
      --amber:   #f59e0b;
      --green:   #22c55e;
      --red:     #ef4444;
      --blue:    #0ea5e9;
      --purple:  #a855f7;
      --radius:  10px;
    }
    html { overflow-x: hidden; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

    /* ─── SIDEBAR ─────────────────────────────── */
    .sidebar {
      width: 230px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      transition: transform .3s;
    }
    .sidebar-logo {
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-mark {
      width: 38px; height: 38px;
      background: var(--orange);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 900; font-size: 20px;
      color: #fff;
      transform: rotate(-3deg);
      flex-shrink: 0;
    }
    .logo-text { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; line-height: 1.2; }
    .logo-text small { display: block; font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 1.5px; font-weight: 400; }

    .sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
    .nav-section-label {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
      padding: 12px 8px 6px;
      text-transform: uppercase;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(240,242,247,.6);
      cursor: pointer;
      transition: background .15s, color .15s;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
      position: relative;
    }
    .nav-item:hover { background: rgba(255,255,255,.05); color: var(--text); }
    .nav-item.active { background: rgba(249,115,22,.12); color: var(--orange); }
    .nav-item .icon { width: 18px; text-align: center; flex-shrink: 0; font-size: 15px; }
    .nav-badge {
      margin-left: auto;
      background: var(--red);
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      min-width: 18px;
      text-align: center;
    }
    .nav-badge.green { background: var(--green); }

    .sidebar-bottom {
      padding: 16px 12px;
      border-top: 1px solid var(--border);
    }
    .sidebar-bottom a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--muted);
      transition: color .2s, background .2s;
    }
    .sidebar-bottom a:hover { color: var(--red); background: rgba(239,68,68,.08); }

    /* ─── MAIN ────────────────────────────────── */
    .main {
      margin-left: 230px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      height: 58px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-title {
      font-family: 'Syne', sans-serif;
      font-size: 17px;
      font-weight: 800;
    }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .topbar-btn {
      padding: 7px 16px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background .2s;
    }
    .btn-primary { background: var(--orange); color: #fff; }
    .btn-primary:hover { background: #ea6c00; }
    .btn-secondary { background: var(--surface3); color: var(--text); border: 1px solid var(--border2); }
    .btn-secondary:hover { background: var(--surface2); }
    .btn-danger { background: rgba(239,68,68,.12); color: var(--red); border: 1px solid rgba(239,68,68,.2); }
    .btn-danger:hover { background: rgba(239,68,68,.2); }
    .btn-success { background: rgba(34,197,94,.12); color: var(--green); border: 1px solid rgba(34,197,94,.2); }
    .btn-success:hover { background: rgba(34,197,94,.2); }
    .btn-warning { background: rgba(245,158,11,.12); color: var(--amber); border: 1px solid rgba(245,158,11,.2); }
    .btn-warning:hover { background: rgba(245,158,11,.25); }
    .btn-sm { padding: 5px 11px; font-size: 11px; border-radius: 6px; }

    .page-content { padding: 28px; flex: 1; }

    /* ─── STAT CARDS ──────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      bottom: -20px; right: -20px;
      width: 80px; height: 80px;
      border-radius: 50%;
      opacity: .08;
    }
    .stat-card.orange::before { background: var(--orange); }
    .stat-card.blue::before   { background: var(--blue); }
    .stat-card.green::before  { background: var(--green); }
    .stat-card.purple::before { background: var(--purple); }
    .stat-icon { font-size: 22px; margin-bottom: 10px; }
    .stat-label { font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .stat-value { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 900; line-height: 1; }
    .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .stat-card.orange .stat-value { color: var(--orange); }
    .stat-card.blue   .stat-value { color: var(--blue); }
    .stat-card.green  .stat-value { color: var(--green); }
    .stat-card.purple .stat-value { color: var(--purple); }

    /* ─── TABLE ───────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-header h3 {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
    }
    .card-header-actions { display: flex; gap: 8px; align-items: center; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      background: var(--surface2);
      padding: 10px 16px;
      text-align: left;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 400;
      white-space: nowrap;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'Space Mono', monospace;
    }
    .badge.published { background: rgba(34,197,94,.12); color: var(--green); }
    .badge.draft     { background: rgba(245,158,11,.12); color: var(--amber); }
    .badge.pending   { background: rgba(249,115,22,.12); color: var(--orange); }
    .badge.approved  { background: rgba(34,197,94,.12); color: var(--green); }
    .badge.rejected  { background: rgba(239,68,68,.12); color: var(--red); }

    .table-actions { display: flex; gap: 6px; }
    .article-thumb {
      width: 40px; height: 40px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--surface3);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .article-title-cell { display: flex; align-items: center; gap: 10px; max-width: 280px; }
    .article-title-text { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ─── FORM ────────────────────────────────── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-full { grid-column: span 2; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .5px;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace;
    }
    .form-input, .form-select, .form-textarea {
      background: var(--surface2);
      border: 1.5px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      width: 100%;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(249,115,22,.12);
    }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--muted); }
    .form-select option { background: var(--surface2); }
    .form-textarea { resize: vertical; min-height: 100px; line-height: 1.6; }
    .form-textarea.tall { min-height: 320px; }

    /* Rich text toolbar */
    .editor-toolbar {
      background: var(--surface2);
      border: 1.5px solid var(--border2);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 8px 12px;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .editor-toolbar button {
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .editor-toolbar button:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }
    .editor-toolbar .sep { width: 1px; height: 22px; background: var(--border2); margin: 0 4px; align-self: center; }
    #contentEditor {
      background: var(--surface2);
      border: 1.5px solid var(--border2);
      border-top: none;
      border-radius: 0 0 8px 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 14px;
      outline: none;
      min-height: 320px;
      line-height: 1.7;
    }
    #contentEditor:focus { border-color: var(--orange); }
    #contentEditor h3 { font-size: 18px; font-weight: 700; margin: 12px 0 6px; color: var(--text); }
    #contentEditor blockquote { border-left: 3px solid var(--orange); padding: 8px 14px; margin: 12px 0; background: rgba(255,255,255,.04); border-radius: 0 6px 6px 0; }
    #contentEditor p { margin-bottom: 10px; }

    /* Upload zone */
    .upload-zone {
      background: var(--surface2);
      border: 2px dashed var(--border2);
      border-radius: 8px;
      padding: 28px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    .upload-zone:hover { border-color: var(--orange); background: rgba(249,115,22,.04); }
    .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-zone-icon { font-size: 28px; margin-bottom: 8px; }
    .upload-zone p { font-size: 13px; color: var(--muted); }
    .upload-zone strong { color: var(--orange); }
    .upload-preview { max-height: 120px; border-radius: 6px; margin: 12px auto 0; display: none; }

    /* ─── MODAL ───────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(5,8,15,.88);
      backdrop-filter: blur(8px);
      z-index: 500;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
      padding: 24px;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 16px;
      width: 100%;
      max-width: 820px;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(20px) scale(.97);
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      box-shadow: 0 40px 80px rgba(0,0,0,.5);
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0;
      background: var(--surface);
      z-index: 2;
    }
    .modal-header h2 { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; }
    .modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; }
    .modal-close:hover { color: var(--red); }
    .modal-body { padding: 24px; }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      position: sticky; bottom: 0;
      background: var(--surface);
    }

    /* ─── TOAST ───────────────────────────────── */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 999;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 13px 18px;
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; font-weight: 500;
      box-shadow: 0 12px 40px rgba(0,0,0,.4);
      opacity: 0; transform: translateY(8px);
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      max-width: 340px;
    }
    .toast.show { opacity: 1; transform: translateY(0); pointer-events: all; }
    .toast.success { border-color: rgba(34,197,94,.3); }
    .toast.error   { border-color: rgba(239,68,68,.3); }

    /* ─── IMAGE GALLERY ───────────────────────── */
    .img-gallery { display: grid; grid-template-columns: repeat(auto-fill,minmax(130px,1fr)); gap: 12px; }
    .img-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      aspect-ratio: 1;
      background: var(--surface2);
    }
    .img-item img { width: 100%; height: 100%; object-fit: cover; }
    .img-item-actions {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.6);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      opacity: 0; transition: opacity .2s;
    }
    .img-item:hover .img-item-actions { opacity: 1; }

    /* ─── COMMENT CARD ────────────────────────── */
    .comment-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
    }
    .comment-avatar-admin {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--surface3);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: var(--text);
      flex-shrink: 0;
    }
    .comment-card-body { flex: 1; }
    .comment-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
    .comment-card-name { font-size: 13px; font-weight: 600; }
    .comment-card-article { font-size: 11px; color: var(--muted); }
    .comment-card-date { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); }
    .comment-card-text { font-size: 13px; color: rgba(240,242,247,.7); line-height: 1.6; margin-bottom: 10px; }
    .comment-card-actions { display: flex; gap: 8px; }

    /* ─── EMPTY STATE ─────────────────────────── */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* ─── NEWSLETTER ──────────────────────────── */
    .subscriber-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); }
    .subscriber-row:last-child { border-bottom: none; }
    .subscriber-email { font-size: 13px; }
    .subscriber-date { font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; }

    /* ─── TOP ARTICLES ────────────────────────── */
    .top-article-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    .top-article-row:last-child { border-bottom: none; }
    .top-rank { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 900; color: var(--border2); width: 28px; flex-shrink: 0; }
    .top-title { font-size: 13px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-views { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--blue); flex-shrink: 0; }

    /* ─── SEARCH ──────────────────────────────── */
    .table-search {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 7px;
      padding: 7px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      width: 200px;
    }
    .table-search:focus { border-color: var(--orange); }
    .table-search::placeholder { color: var(--muted); }

    /* ─── CONFIRM DIALOG ──────────────────────── */
    .confirm-overlay {
      position: fixed; inset: 0;
      background: rgba(5,8,15,.88);
      backdrop-filter: blur(8px);
      z-index: 600;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .confirm-overlay.open { opacity: 1; pointer-events: all; }
    .confirm-box {
      background: var(--surface);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 14px;
      padding: 28px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      transform: scale(.95);
      transition: transform .2s;
    }
    .confirm-overlay.open .confirm-box { transform: scale(1); }
    .confirm-icon { font-size: 32px; margin-bottom: 12px; }
    .confirm-title { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 800; margin-bottom: 8px; }
    .confirm-msg { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
    .confirm-actions { display: flex; gap: 10px; justify-content: center; }

    /* ─── RESPONSIVE ──────────────────────────── */
    @media (max-width: 1024px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); transition: transform .3s ease; }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .form-full { grid-column: span 1; }
      .menu-btn { display: flex !important; }
      .sidebar-overlay { display: block; }
      .sidebar-overlay.active { opacity: 1; pointer-events: all; }
    }

    .menu-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 40px; height: 40px;
      background: var(--surface2);
      border: 1.5px solid var(--border2);
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
      color: var(--text);
      flex-shrink: 0;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }

    /* ─── SCROLLBAR ───────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

    /* ─── ANIMATIONS ──────────────────────────── */
    .fade-in { animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

<!-- Overlay mobile -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- ═══ SIDEBAR ══════════════════════════════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">G</div>
    <div class="logo-text">Garoua Vibes <small>ADMIN PANEL</small></div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Principal</div>
    <button class="nav-item active" onclick="goTo('dashboard')"><span class="icon">📊</span>Dashboard</button>

<!-- ═══ JS ═══════════════════════════════════════════════════ -->
<script>
// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
let currentPage = 'dashboard';
let editingArticleId = null;
let pendingDelete = null;
let cachedStats = null;

// ═══════════════════════════════════════════════════
//  ROUTER
// ═══════════════════════════════════════════════════
function goTo(page) {
  currentPage = page;
  closeSidebar(); // ferme le menu sur mobile
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const map = { dashboard:0, articles:1, 'new-article':2, comments:3, images:4, newsletter:5 };
  const navItems = document.querySelectorAll('.nav-item');
  if (map[page] !== undefined) navItems[map[page]]?.classList.add('active');

  const titles = {
    dashboard: 'Dashboard', articles: 'Articles', 'new-article': 'Nouvel article',
    comments: 'Commentaires', images: 'Médiathèque', newsletter: 'Newsletter'
  };
  document.getElementById('topbarTitle').textContent = titles[page] || page;

  const content = document.getElementById('pageContent');
  content.className = 'page-content fade-in';

  switch(page) {
    case 'dashboard':    renderDashboard(); break;
    case 'articles':     renderArticles(); break;
    case 'new-article':  renderNewArticle(); break;
    case 'comments':     renderComments(); break;
    case 'images':       renderImages(); break;
    case 'newsletter':   renderNewsletter(); break;
  }
}

// ═══════════════════════════════════════════════════
//  API HELPERS
// ═══════════════════════════════════════════════════
async function api(method, url, body = null) {
  const opts = { method, headers: {} };
  if (body instanceof FormData) {
    opts.body = body;
  } else if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  return res.json();
}

// ═══════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════
let toastTimer;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastIcon').textContent = type === 'error' ? '❌' : type === 'warning' ? '⚠️' : '✅';
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

// ═══════════════════════════════════════════════════
//  CONFIRM
// ═══════════════════════════════════════════════════
function showConfirm(title, msg, onConfirm) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmBtn').onclick = () => { closeConfirm(); onConfirm(); };
  document.getElementById('confirmOverlay').classList.add('open');
}
function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('open'); }

// ═══════════════════════════════════════════════════
//  SIDEBAR MOBILE
// ═══════════════════════════════════════════════════
function toggleSidebar() {
  const sidebar  = document.getElementById('sidebar');
  const overlay  = document.getElementById('sidebarOverlay');
  const isOpen   = sidebar.classList.contains('open');
  if (isOpen) {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
  } else {
    sidebar.classList.add('open');
    overlay.classList.add('active');
  }
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
}
if (window.innerWidth <= 768) document.getElementById('menuBtn').style.display = 'block';

// ═══════════════════════════════════════════════════
//  PAGE: DASHBOARD
// ═══════════════════════════════════════════════════
async function renderDashboard() {
  document.getElementById('topbarActions').innerHTML = `
    <button class="topbar-btn btn-primary" onclick="goTo('new-article')">✏️ Nouvel article</button>`;

  const stats = await api('GET', '/api/admin/stats');
  cachedStats = stats;

  // Update badges
  document.getElementById('badge-articles').textContent = stats.articles.published;
  const pendingBadge = document.getElementById('badge-comments');
  if (stats.comments.pending > 0) {
    pendingBadge.textContent = stats.comments.pending;
    pendingBadge.style.display = '';
  } else {
    pendingBadge.style.display = 'none';
  }
  document.getElementById('badge-newsletter').textContent = stats.newsletter.total;

  document.getElementById('pageContent').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card orange">
        <div class="stat-icon">📝</div>
        <div class="stat-label">Articles publiés</div>
        <div class="stat-value">${stats.articles.published}</div>
        <div class="stat-sub">${stats.articles.drafts} brouillon${stats.articles.drafts !== 1 ? 's' : ''}</div>
      </div>
      <div class="stat-card blue">
        <div class="stat-icon">👁</div>
        <div class="stat-label">Vues totales</div>
        <div class="stat-value">${stats.views.toLocaleString()}</div>
        <div class="stat-sub">Tous les articles</div>
      </div>
      <div class="stat-card green">
        <div class="stat-icon">💬</div>
        <div class="stat-label">Commentaires</div>
        <div class="stat-value">${stats.comments.approved}</div>
        <div class="stat-sub">${stats.comments.pending} en attente</div>
      </div>
      <div class="stat-card purple">
        <div class="stat-icon">📬</div>
        <div class="stat-label">Abonnés</div>
        <div class="stat-value">${stats.newsletter.total}</div>
        <div class="stat-sub">Newsletter</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div class="card">
        <div class="card-header"><h3>🏆 Articles les plus vus</h3></div>
        <div id="topArticlesList">
          ${stats.topArticles.length === 0 ? `<div class="empty-state"><p>Aucun article</p></div>` :
            stats.topArticles.map((a,i) => `
              <div class="top-article-row">
                <div class="top-rank">${String(i+1).padStart(2,'0')}</div>
                <div class="top-title">${a.title}</div>
                <span class="badge ${a.status}">${a.status === 'published' ? 'Publié' : 'Brouillon'}</span>
                <div class="top-views">👁 ${a.views}</div>
              </div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <h3>⏳ Commentaires en attente</h3>
          <button class="topbar-btn btn-sm btn-secondary" onclick="goTo('comments')">Voir tout</button>
        </div>
        <div id="pendingCommentsList"></div>
      </div>
    </div>`;

  // Load pending comments
  const comments = await api('GET', '/api/admin/comments');
  const pending = comments.filter(c => c.status === 'pending').slice(0, 4);
  const pendingEl = document.getElementById('pendingCommentsList');
  if (!pendingEl) return;
  if (pending.length === 0) {
    pendingEl.innerHTML = `<div class="empty-state"><div class="empty-icon">✅</div><p>Aucun commentaire en attente</p></div>`;
  } else {
    pendingEl.innerHTML = pending.map(c => `
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <strong style="font-size:13px;">${c.name}</strong>
          <div style="display:flex;gap:6px;">
            <button class="topbar-btn btn-sm btn-success" onclick="quickApprove(${c.id})">✓</button>
            <button class="topbar-btn btn-sm btn-danger" onclick="quickDeleteComment(${c.id})">✕</button>
          </div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">${c.articleTitle}</div>
        <div style="font-size:12px;color:rgba(240,242,247,.6);">${c.text.substring(0,80)}${c.text.length > 80 ? '…' : ''}</div>
      </div>`).join('');
  }
}

async function quickApprove(id) {
  await api('PUT', `/api/admin/comments/${id}`, { status: 'approved' });
  showToast('Commentaire approuvé ✅');
  renderDashboard();
}
async function quickDeleteComment(id) {
  await api('DELETE', `/api/admin/comments/${id}`);
  showToast('Commentaire supprimé');
  renderDashboard();
}

// ═══════════════════════════════════════════════════
//  PAGE: ARTICLES
// ═══════════════════════════════════════════════════
async function renderArticles() {
  document.getElementById('topbarActions').innerHTML = `
    <button class="topbar-btn btn-primary" onclick="goTo('new-article')">✏️ Nouvel article</button>`;

  const articles = await api('GET', '/api/admin/articles');

  document.getElementById('pageContent').innerHTML = `
    <div class="card">
      <div class="card-header">
        <h3>Tous les articles (${articles.length})</h3>
        <div class="card-header-actions">
          <input class="table-search" id="articleSearch" placeholder="🔍 Rechercher…" oninput="filterArticleTable(this.value)"/>
        </div>
      </div>
      ${articles.length === 0 ? `<div class="empty-state"><div class="empty-icon">📝</div><p>Aucun article. <a href="#" onclick="goTo('new-article')" style="color:var(--orange)">Créez le premier</a></p></div>` : `
      <table id="articlesTable">
        <thead>
          <tr>
            <th>Article</th>
            <th>Catégorie</th>
            <th>Statut</th>
            <th>Vues</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${articles.map(a => `
            <tr data-title="${a.title.toLowerCase()}">
              <td>
                <div class="article-title-cell">
                  <div class="article-thumb">${a.img ? `<img src="${a.img}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;">` : '📄'}</div>
                  <span class="article-title-text">${a.title}</span>
                </div>
              </td>
              <td><span style="font-size:11px;color:var(--muted);">${a.catLabel || a.category}</span></td>
              <td><span class="badge ${a.status}">${a.status === 'published' ? 'Publié' : 'Brouillon'}</span>${a.featured ? ' <span class="badge" style="background:rgba(245,158,11,.15);color:#f59e0b;">⭐ À la une</span>' : ''}</td>
              <td><span style="font-family:'Space Mono',monospace;font-size:12px;">👁 ${a.views || 0}</span></td>
              <td><span style="font-size:12px;color:var(--muted);">${new Date(a.createdAt).toLocaleDateString('fr-FR')}</span></td>
              <td>
                <div class="table-actions">
                  <button class="topbar-btn btn-sm btn-secondary" onclick="openEditModal(${a.id})">✏️ Modifier</button>
                  <button class="topbar-btn btn-sm ${a.status === 'published' ? 'btn-secondary' : 'btn-success'}" onclick="toggleStatus(${a.id},'${a.status}')">
                    ${a.status === 'published' ? '📥 Dépublier' : '🚀 Publier'}
                  </button>
                  <button class="topbar-btn btn-sm ${a.trending ? 'btn-warning' : 'btn-secondary'}" onclick="toggleTrending(${a.id},${!!a.trending})" title="${a.trending ? 'Retirer des tendances' : 'Mettre en tendance'}">
                    ${a.trending ? '🔥 Tendance' : '📈 Tendance?'}
                  </button>
                  <button class="topbar-btn btn-sm btn-danger" onclick="deleteArticle(${a.id},'${a.title.replace(/'/g,"\\'")}')">🗑</button>
                </div>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`}
    </div>`;
}

function filterArticleTable(q) {
  document.querySelectorAll('#articlesTable tbody tr').forEach(row => {
    row.style.display = row.dataset.title.includes(q.toLowerCase()) ? '' : 'none';
  });
}

async function toggleTrending(id, current) {
  await api('PUT', `/api/admin/articles/${id}`, { trending: !current });
  showToast(!current ? '🔥 Article mis en tendance !' : 'Retiré des tendances');
  renderArticles();
}

async function toggleStatus(id, current) {
  const newStatus = current === 'published' ? 'draft' : 'published';
  await api('PUT', `/api/admin/articles/${id}`, { status: newStatus });
  showToast(newStatus === 'published' ? 'Article publié 🚀' : 'Article dépublié');
  renderArticles();
}

async function deleteArticle(id, title) {
  showConfirm('Supprimer cet article ?', `"${title}" sera définitivement supprimé.`, async () => {
    await api('DELETE', `/api/admin/articles/${id}`);
    showToast('Article supprimé');
    renderArticles();
  });
}

// ═══════════════════════════════════════════════════
//  PAGE: NEW ARTICLE
// ═══════════════════════════════════════════════════
function renderNewArticle() {
  document.getElementById('topbarActions').innerHTML = `
    <button class="topbar-btn btn-secondary" onclick="goTo('articles')">← Retour</button>
    <button class="topbar-btn btn-secondary" onclick="submitNewArticle('draft')">💾 Brouillon</button>
    <button class="topbar-btn btn-primary" onclick="submitNewArticle('published')">🚀 Publier</button>`;

  document.getElementById('pageContent').innerHTML = `
    <div class="card">
      <div class="card-header"><h3>✏️ Rédiger un nouvel article</h3></div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group form-full">
            <label class="form-label">Titre *</label>
            <input class="form-input" id="na-title" placeholder="Titre de l'article…" />
          </div>
          <div class="form-group">
            <label class="form-label">Catégorie</label>
            <select class="form-select" id="na-category" onchange="updateCatMeta(this.value)">
              <option value="culture">🎭 Culture</option>
              <option value="monuments">🏛 Monuments</option>
              <option value="saveurs">🍽 Saveurs</option>
              <option value="evenements">📅 Événements</option>
              <option value="vie">🌆 Vie Locale</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Auteur</label>
            <input class="form-input" id="na-author" value="Kléin Nasser" />
          </div>
          <div class="form-group">
            <label class="form-label">À la une</label>
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 14px;background:var(--surface2);border:1.5px solid var(--border2);border-radius:8px;">
              <input type="checkbox" id="na-featured"
                style="width:16px;height:16px;accent-color:var(--orange);cursor:pointer;"/>
              <span style="font-size:13px;color:var(--text);">⭐ Mettre cet article à la une du blog</span>
            </label>
          </div>
          <div class="form-group form-full">
            <label class="form-label">Extrait (résumé court)</label>
            <textarea class="form-textarea" id="na-excerpt" placeholder="Un court résumé affiché sur la liste des articles…" rows="3"></textarea>
          </div>
          <div class="form-group form-full">
            <label class="form-label">Contenu *</label>
            <div class="editor-toolbar">
              <button onclick="fmt('bold')" title="Gras"><b>G</b></button>
              <button onclick="fmt('italic')" title="Italique"><i>I</i></button>
              <div class="sep"></div>
              <button onclick="insertBlock('h3')" title="Titre H3">H3</button>
              <button onclick="insertBlock('p')" title="Paragraphe">¶</button>
              <button onclick="insertBlock('blockquote')" title="Citation">❝</button>
              <div class="sep"></div>
              <button onclick="fmt('insertUnorderedList')" title="Liste">•</button>
              <button onclick="fmt('insertOrderedList')" title="Liste numérotée">1.</button>
              <div class="sep"></div>
              <button onclick="viewSource()" title="Code HTML" id="srcBtn">⟨/⟩</button>
            </div>
            <div id="contentEditor" contenteditable="true" spellcheck="true"></div>
            <textarea id="contentSource" class="form-textarea tall" style="display:none;font-family:monospace;font-size:12px;" placeholder="HTML source…"></textarea>
          </div>
          <div class="form-group form-full">
            <label class="form-label">Image de couverture</label>
            <div class="upload-zone" id="uploadZone">
              <input type="file" id="na-img" accept="image/*" onchange="previewImage(this)"/>
              <div class="upload-zone-icon">🖼️</div>
              <p><strong>Cliquez ou glissez</strong> une image ici</p>
              <p style="margin-top:4px;font-size:11px;">JPG, PNG, WEBP — max 5MB</p>
              <img class="upload-preview" id="imgPreview"/>
            </div>
          </div>
          <div class="form-group form-full">
            <label class="form-label">Légende de l'image</label>
            <input class="form-input" id="na-caption" placeholder="Ex: Vue de la mosquée centrale de Garoua"/>
          </div>
          <div class="form-group">
            <label class="form-label">Tags (séparés par virgule)</label>
            <input class="form-input" id="na-tags" placeholder="garoua, patrimoine, culture…" />
          </div>
          <input type="hidden" id="na-catLabel" value="Monuments"/>
          <input type="hidden" id="na-catColor" value="#a855f7"/>
        </div>
      </div>
    </div>`;
}

function fmt(cmd) {
  document.getElementById('contentEditor').focus();
  document.execCommand(cmd, false, null);
}

function insertBlock(tag) {
  const editor = document.getElementById('contentEditor');
  editor.focus();
  let html = '';
  if (tag === 'h3') html = '<h3>Titre de section</h3>';
  else if (tag === 'blockquote') html = '<blockquote>Votre citation ici…</blockquote>';
  else html = '<p>Nouveau paragraphe…</p>';
  document.execCommand('insertHTML', false, html);
}

let sourceMode = false;
function viewSource() {
  const editor = document.getElementById('contentEditor');
  const source = document.getElementById('contentSource');
  const btn = document.getElementById('srcBtn');
  if (!sourceMode) {
    source.value = editor.innerHTML;
    editor.style.display = 'none';
    source.style.display = 'block';
    btn.style.color = 'var(--orange)';
  } else {
    editor.innerHTML = source.value;
    source.style.display = 'none';
    editor.style.display = 'block';
    btn.style.color = '';
  }
  sourceMode = !sourceMode;
}

function previewImage(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('imgPreview');
    img.src = e.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

const CAT_META = {
  culture:     { label: '🎭 Culture',       color: '#c9502a' },
  monuments:   { label: '🏛 Monuments',     color: '#d4891a' },
  saveurs:     { label: '🍽 Saveurs',       color: '#2d7a4f' },
  evenements:  { label: '📅 Événements',    color: '#e74c3c' },
  vie:         { label: '🌆 Vie Locale',    color: '#3b82c4' }
};
function updateCatMeta(val) {
  const m = CAT_META[val] || { label: val, color: '#f97316' };
  const lbl = document.getElementById('na-catLabel');
  const clr = document.getElementById('na-catColor');
  if (lbl) lbl.value = m.label;
  if (clr) clr.value = m.color;
}

async function submitNewArticle(status) {
  const title = document.getElementById('na-title')?.value.trim();
  let content = sourceMode
    ? document.getElementById('contentSource').value
    : document.getElementById('contentEditor').innerHTML;

  if (!title) { showToast('Le titre est requis', 'error'); return; }
  if (!content || content === '<br>') { showToast('Le contenu est requis', 'error'); return; }

  const fd = new FormData();
  fd.append('title',    title);
  fd.append('category', document.getElementById('na-category').value);
  fd.append('catLabel', document.getElementById('na-catLabel').value);
  fd.append('catColor', document.getElementById('na-catColor').value);
  fd.append('excerpt',  document.getElementById('na-excerpt').value);
  fd.append('content',  content);
  fd.append('author',   document.getElementById('na-author').value);
  fd.append('tags',     document.getElementById('na-tags').value);
  fd.append('status',   status);
  fd.append('featured', document.getElementById('na-featured')?.checked ? 'true' : 'false');
  fd.append('caption',  document.getElementById('na-caption')?.value || '');

  const imgInput = document.getElementById('na-img');
  if (imgInput?.files[0]) fd.append('img', imgInput.files[0]);

  const res = await api('POST', '/api/admin/articles', fd);
  if (res.success) {
    showToast(status === 'published' ? 'Article publié ! 🚀' : 'Brouillon sauvegardé 💾');
    goTo('articles');
  } else {
    showToast(res.error || 'Erreur lors de la publication', 'error');
  }
}

// ═══════════════════════════════════════════════════
//  EDIT MODAL
// ═══════════════════════════════════════════════════
async function openEditModal(id) {
  const articles = await api('GET', '/api/admin/articles');
  const a = articles.find(x => x.id === id);
  if (!a) return;
  editingArticleId = id;

  document.getElementById('modalTitle').textContent = 'Modifier : ' + a.title;
  document.getElementById('modalFormContent').innerHTML = `
    <div class="form-group form-full">
      <label class="form-label">Titre</label>
      <input class="form-input" id="edit-title" value="${a.title.replace(/"/g,'&quot;')}"/>
    </div>
    <div class="form-group">
      <label class="form-label">Catégorie</label>
      <select class="form-select" id="edit-category" onchange="updateEditCatMeta(this.value)">
        ${Object.entries(CAT_META).map(([k,v]) => `<option value="${k}" ${a.category===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Statut</label>
      <select class="form-select" id="edit-status">
        <option value="published" ${a.status==='published'?'selected':''}>🚀 Publié</option>
        <option value="draft" ${a.status==='draft'?'selected':''}>💾 Brouillon</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Auteur</label>
      <input class="form-input" id="edit-author" value="${(a.author||'').replace(/"/g,'&quot;')}" placeholder="Nom de l'auteur"/>
    </div>
    <div class="form-group">
      <label class="form-label">À la une</label>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 14px;background:var(--surface2);border:1.5px solid var(--border2);border-radius:8px;">
        <input type="checkbox" id="edit-featured" ${a.featured ? 'checked' : ''}
          style="width:16px;height:16px;accent-color:var(--orange);cursor:pointer;"/>
        <span style="font-size:13px;color:var(--text);">⭐ Afficher cet article à la une du blog</span>
      </label>
    </div>
    <div class="form-group form-full">
      <label class="form-label">Extrait</label>
      <textarea class="form-textarea" id="edit-excerpt">${a.excerpt}</textarea>
    </div>
    <div class="form-group form-full">
      <label class="form-label">Contenu *</label>
      <div class="editor-toolbar">
        <button onclick="fmtEdit('bold')" title="Gras"><b>G</b></button>
        <button onclick="fmtEdit('italic')" title="Italique"><i>I</i></button>
        <div class="sep"></div>
        <button onclick="insertEditBlock('h3')" title="Titre H3">H3</button>
        <button onclick="insertEditBlock('p')" title="Paragraphe">¶</button>
        <button onclick="insertEditBlock('blockquote')" title="Citation">❝</button>
        <div class="sep"></div>
        <button onclick="fmtEdit('insertUnorderedList')" title="Liste">•</button>
        <button onclick="fmtEdit('insertOrderedList')" title="Liste numérotée">1.</button>
        <div class="sep"></div>
        <button onclick="viewEditSource()" title="Code HTML" id="editSrcBtn">⟨/⟩</button>
      </div>
      <div id="editContentEditor" contenteditable="true" spellcheck="true" style="min-height:220px;padding:16px;background:var(--surface2);border:1.5px solid var(--border2);border-radius:0 0 8px 8px;outline:none;font-size:14px;line-height:1.7;color:var(--text);"></div>
      <textarea id="editContentSource" class="form-textarea tall" style="display:none;font-family:monospace;font-size:12px;" placeholder="HTML source…"></textarea>
      <input type="hidden" id="edit-content"/>
    </div>
    <div class="form-group">
      <label class="form-label">Tags</label>
      <input class="form-input" id="edit-tags" value="${(a.tags||[]).join(', ')}"/>
    </div>
    <div class="form-group">
      <label class="form-label">Nouvelle image</label>
      <div class="upload-zone">
        <input type="file" id="edit-img" accept="image/*" onchange="previewEditImage(this)"/>
        <div class="upload-zone-icon">🖼️</div>
        <p>${a.img ? '✅ Image actuelle : <strong>' + a.img + '</strong>' : 'Aucune image — cliquez pour ajouter'}</p>
        <img class="upload-preview" id="editImgPreview"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Légende de l'image</label>
      <input class="form-input" id="edit-caption" value="${(a.caption||'').replace(/"/g,'&quot;')}" placeholder="Ex: Vue de la mosquée centrale de Garoua"/>
    </div>
    <input type="hidden" id="edit-catLabel" value="${a.catLabel||''}"/>
    <input type="hidden" id="edit-catColor" value="${a.catColor||''}"/>`;

  document.getElementById('articleModal').classList.add('open');

  // Initialiser l'éditeur riche avec le contenu existant
  setTimeout(() => {
    const editEditor = document.getElementById('editContentEditor');
    if (editEditor) editEditor.innerHTML = a.content || '';
  }, 50);
}

function fmtEdit(cmd) {
  document.getElementById('editContentEditor').focus();
  document.execCommand(cmd, false, null);
}

function insertEditBlock(tag) {
  const editor = document.getElementById('editContentEditor');
  editor.focus();
  const el = document.createElement(tag);
  el.textContent = tag === 'blockquote' ? 'Citation…' : tag === 'h3' ? 'Titre…' : 'Paragraphe…';
  const sel = window.getSelection();
  if (sel.rangeCount) {
    const range = sel.getRangeAt(0);
    range.collapse(false);
    range.insertNode(el);
    range.setStartAfter(el);
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    editor.appendChild(el);
  }
}

function viewEditSource() {
  const editor = document.getElementById('editContentEditor');
  const source = document.getElementById('editContentSource');
  const btn    = document.getElementById('editSrcBtn');
  if (editor.style.display !== 'none') {
    source.value = editor.innerHTML;
    editor.style.display = 'none';
    source.style.display = 'block';
    btn.style.color = 'var(--orange)';
  } else {
    editor.innerHTML = source.value;
    source.style.display = 'none';
    editor.style.display = 'block';
    btn.style.color = '';
  }
}

function previewEditImage(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('editImgPreview');
    img.src = e.target.result; img.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function updateEditCatMeta(val) {
  const m = CAT_META[val] || {};
  const lbl = document.getElementById('edit-catLabel');
  const clr = document.getElementById('edit-catColor');
  if (lbl && m.label) lbl.value = m.label;
  if (clr && m.color) clr.value = m.color;
}

async function saveArticle() {
  if (!editingArticleId) return;

  // Récupérer le contenu depuis l'éditeur riche ou la source HTML
  const editEditor = document.getElementById('editContentEditor');
  const editSource = document.getElementById('editContentSource');
  const content = editSource.style.display !== 'none' ? editSource.value : editEditor.innerHTML;

  const fd = new FormData();
  fd.append('title',    document.getElementById('edit-title').value);
  fd.append('category', document.getElementById('edit-category').value);
  fd.append('catLabel', document.getElementById('edit-catLabel').value);
  fd.append('catColor', document.getElementById('edit-catColor').value);
  fd.append('excerpt',  document.getElementById('edit-excerpt').value);
  fd.append('content',  content);
  fd.append('caption',  document.getElementById('edit-caption')?.value || '');
  fd.append('tags',     document.getElementById('edit-tags').value);
  fd.append('status',   document.getElementById('edit-status').value);
  fd.append('author',   document.getElementById('edit-author').value);
  fd.append('featured', document.getElementById('edit-featured').checked ? 'true' : 'false');

  const imgInput = document.getElementById('edit-img');
  if (imgInput?.files[0]) fd.append('img', imgInput.files[0]);

  const res = await api('PUT', `/api/admin/articles/${editingArticleId}`, fd);
  if (res.success) {
    closeModal();
    showToast('Article mis à jour ✅');
    renderArticles();
  } else {
    showToast(res.error || 'Erreur', 'error');
  }
}

function closeModal() {
  document.getElementById('articleModal').classList.remove('open');
  editingArticleId = null;
}

// ═══════════════════════════════════════════════════
//  PAGE: COMMENTAIRES
// ═══════════════════════════════════════════════════
async function renderComments() {
  document.getElementById('topbarActions').innerHTML = `
    <select class="form-select" style="width:160px;padding:7px 12px;font-size:12px;" id="commentFilter" onchange="filterComments(this.value)">
      <option value="all">Tous</option>
      <option value="pending">En attente</option>
      <option value="approved">Approuvés</option>
      <option value="rejected">Rejetés</option>
    </select>`;

  const comments = await api('GET', '/api/admin/comments');
  window._allComments = comments;
  renderCommentList(comments);
}

function filterComments(status) {
  const all = window._allComments || [];
  renderCommentList(status === 'all' ? all : all.filter(c => c.status === status));
}

function renderCommentList(comments) {
  const COLORS = ['#f97316','#a855f7','#0ea5e9','#22c55e','#ef4444'];
  const html = comments.length === 0
    ? `<div class="empty-state"><div class="empty-icon">💬</div><p>Aucun commentaire</p></div>`
    : comments.map((c, i) => `
        <div class="comment-card">
          <div class="comment-avatar-admin" style="background:${COLORS[i%COLORS.length]}20;color:${COLORS[i%COLORS.length]};">${c.name.charAt(0)}</div>
          <div class="comment-card-body">
            <div class="comment-card-header">
              <span class="comment-card-name">${c.name}</span>
              <span class="badge ${c.status}">${c.status === 'approved' ? 'Approuvé' : c.status === 'pending' ? 'En attente' : 'Rejeté'}</span>
              <span class="comment-card-article">📝 ${c.articleTitle}</span>
              <span class="comment-card-date">${new Date(c.createdAt).toLocaleDateString('fr-FR')}</span>
            </div>
            <div class="comment-card-text">${c.text}</div>
            <div class="comment-card-actions">
              ${c.status !== 'approved' ? `<button class="topbar-btn btn-sm btn-success" onclick="updateComment(${c.id},'approved')">✓ Approuver</button>` : ''}
              ${c.status !== 'rejected' ? `<button class="topbar-btn btn-sm btn-danger" onclick="updateComment(${c.id},'rejected')">✕ Rejeter</button>` : ''}
              <button class="topbar-btn btn-sm btn-danger" onclick="deleteComment(${c.id})">🗑 Supprimer</button>
            </div>
          </div>
        </div>`).join('');

  document.getElementById('pageContent').innerHTML = `<div class="card"><div class="card-header"><h3>Commentaires (${comments.length})</h3></div><div style="padding:16px;">${html}</div></div>`;
}

async function updateComment(id, status) {
  await api('PUT', `/api/admin/comments/${id}`, { status });
  showToast(status === 'approved' ? 'Commentaire approuvé ✅' : 'Commentaire rejeté');
  renderComments();
}

async function deleteComment(id) {
  showConfirm('Supprimer ce commentaire ?', 'Cette action est irréversible.', async () => {
    await api('DELETE', `/api/admin/comments/${id}`);
    showToast('Commentaire supprimé');
    renderComments();
  });
}

// ═══════════════════════════════════════════════════
//  PAGE: MÉDIATHÈQUE
// ═══════════════════════════════════════════════════
async function renderImages() {
  document.getElementById('topbarActions').innerHTML = `
    <label class="topbar-btn btn-primary" style="cursor:pointer;">
      📤 Uploader
      <input type="file" accept="image/*" multiple style="display:none;" onchange="uploadImages(this)"/>
    </label>`;

  const images = await api('GET', '/api/admin/images');

  document.getElementById('pageContent').innerHTML = `
    <div class="card">
      <div class="card-header">
        <h3>🖼️ Médiathèque (${images.length} image${images.length !== 1 ? 's' : ''})</h3>
        <span style="font-size:12px;color:var(--muted);">Cliquez sur une image pour copier son URL</span>
      </div>
      <div style="padding:20px;">
        ${images.length === 0
          ? `<div class="empty-state"><div class="empty-icon">🖼️</div><p>Aucune image. Uploadez votre première image !</p></div>`
          : `<div class="img-gallery" id="imgGallery">
              ${images.map(img => `
                <div class="img-item">
                  <img src="${img.url}" alt="${img.name}" loading="lazy"/>
                  <div class="img-item-actions">
                    <button class="topbar-btn btn-sm btn-secondary" onclick="copyUrl('${img.url}')" title="Copier l'URL">📋</button>
                    <button class="topbar-btn btn-sm btn-danger" onclick="deleteImage('${img.name}')" title="Supprimer">🗑</button>
                  </div>
                </div>`).join('')}
            </div>`}
      </div>
    </div>`;
}

async function uploadImages(input) {
  const files = Array.from(input.files);
  let count = 0;
  for (const file of files) {
    const fd = new FormData();
    fd.append('img', file);
    const res = await api('POST', '/api/admin/upload', fd);
    if (res.success) count++;
  }
  showToast(`${count} image${count !== 1 ? 's' : ''} uploadée${count !== 1 ? 's' : ''} ✅`);
  renderImages();
}

function copyUrl(url) {
  navigator.clipboard.writeText(window.location.origin + url).then(() => showToast('URL copiée 📋'));
}

async function deleteImage(name) {
  showConfirm('Supprimer cette image ?', 'Le fichier sera définitivement supprimé.', async () => {
    await api('DELETE', `/api/admin/images/${name}`);
    showToast('Image supprimée');
    renderImages();
  });
}

// ═══════════════════════════════════════════════════
//  PAGE: NEWSLETTER
// ═══════════════════════════════════════════════════
async function renderNewsletter() {
  document.getElementById('topbarActions').innerHTML = `
    <button class="topbar-btn btn-secondary" onclick="exportNewsletter()">📥 Exporter CSV</button>`;

  const subs = await api('GET', '/api/admin/newsletter');

  document.getElementById('pageContent').innerHTML = `
    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px;">
      <div class="stat-card purple">
        <div class="stat-icon">📬</div>
        <div class="stat-label">Total abonnés</div>
        <div class="stat-value">${subs.length}</div>
      </div>
      <div class="stat-card green">
        <div class="stat-icon">📅</div>
        <div class="stat-label">Ce mois</div>
        <div class="stat-value">${subs.filter(s => new Date(s.subscribedAt) > new Date(Date.now() - 30*24*60*60*1000)).length}</div>
      </div>
      <div class="stat-card orange">
        <div class="stat-icon">📈</div>
        <div class="stat-label">Cette semaine</div>
        <div class="stat-value">${subs.filter(s => new Date(s.subscribedAt) > new Date(Date.now() - 7*24*60*60*1000)).length}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <h3>Liste des abonnés</h3>
        <input class="table-search" placeholder="🔍 Filtrer…" oninput="filterSubs(this.value)"/>
      </div>
      ${subs.length === 0
        ? `<div class="empty-state"><div class="empty-icon">📬</div><p>Aucun abonné pour le moment</p></div>`
        : `<div id="subsList">
            ${subs.map(s => `
              <div class="subscriber-row" data-email="${s.email.toLowerCase()}">
                <div>
                  <div class="subscriber-email">${s.name ? `<strong>${s.name}</strong> · ` : ''}${s.email}</div>
                  <div class="subscriber-date">Abonné le ${new Date(s.subscribedAt).toLocaleDateString('fr-FR')}</div>
                </div>
                <button class="topbar-btn btn-sm btn-danger" onclick="deleteSub(${s.id},'${s.email}')">🗑</button>
              </div>`).join('')}
          </div>`}
    </div>`;

  window._subs = subs;
}

function filterSubs(q) {
  document.querySelectorAll('#subsList .subscriber-row').forEach(row => {
    row.style.display = row.dataset.email.includes(q.toLowerCase()) ? '' : 'none';
  });
}

async function deleteSub(id, email) {
  showConfirm('Désabonner ?', `${email} sera retiré de la liste.`, async () => {
    await api('DELETE', `/api/admin/newsletter/${id}`);
    showToast('Abonné supprimé');
    renderNewsletter();
  });
}

function exportNewsletter() {
  const subs = window._subs || [];
  if (subs.length === 0) { showToast('Aucun abonné à exporter', 'warning'); return; }
  const csv = 'Nom,Email,Date\n' + subs.map(s => `"${s.name||''}","${s.email}","${new Date(s.subscribedAt).toLocaleDateString('fr-FR')}"`).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'abonnes-garoua-vibes.csv';
  a.click(); URL.revokeObjectURL(url);
  showToast('Export CSV téléchargé 📥');
}

//  KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeConfirm(); }
});

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
goTo('dashboard');
</script>
